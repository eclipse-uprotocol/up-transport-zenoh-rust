# Create artifacts for project releases 
# Note: might also include crates.io publication step, if we're confident about our overall workflow

name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      RUST_TOOLCHAIN:
        description: 'The Rust toolchain to use for the workflow'
        required: false
        default: 'stable'
  
concurrency:
  group: "release-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: ${{ github.event.inputs.RUST_TOOLCHAIN || 'stable' }}

jobs:
  check:
    uses: ./.github/workflows/check.yaml

  check-msrv:
    uses: eclipse-uprotocol/ci-cd/.github/workflows/rust-verify-msrv.yaml@ad3f99eac0675c714f08c473412dae14d9fecaa8 # main

  coverage:
    uses: eclipse-uprotocol/ci-cd/.github/workflows/rust-coverage.yaml@ad3f99eac0675c714f08c473412dae14d9fecaa8 # main

  current-spec-compliance:
    runs-on: ubuntu-latest
    # we do not invoke the corresponding job from ci-cd repo
    # because we do not want the job to fail if not all requirements
    # are covered (yet)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: "recursive"
          persist-credentials: false

      - name: "Determine OpenFastTrace file patterns from .env file"
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0
        with:
          mode: "oft-current"
          load-mode: strict
        # this will run OFT and upload the results
      - name: Run OpenFastTrace
        id: run-oft
        uses: eclipse-uprotocol/ci-cd/.github/actions/run-oft@ad3f99eac0675c714f08c473412dae14d9fecaa8 # main
        with:
          file-patterns: "${{ env.OFT_FILE_PATTERNS }}"
          tags: "${{ env.OFT_TAGS_}}"
  

  tag_release_artifacts:
    # This only runs if this workflow is initiated via a tag-push with pattern 'v*'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: collect v-tag release artifacts
    runs-on: ubuntu-latest
    needs: 
      - check
      - check-msrv
      - coverage
      - current-spec-compliance
    permissions: write-all
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: "recursive"
          persist-credentials: false

      - name: "Determine uProtocol Specification file patterns from .env file"
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0
        with:
          mode: "oft-current"
          load-mode: strict
  
      # Requirements Tracing report - we later need the download_url output of the upload step
      - name: Download requirements tracing report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tracing-report-html
          path: dist/tracing/
      - name: Upload requirements tracing report to release
        id: upload_requirements_tracing_report
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="tracing-report-html.tar.gz"
          tar -czf "$archive" -C dist tracing
          gh release upload "$TAG" "$archive" --clobber
          echo "browser_download_url=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$archive" >> "$GITHUB_OUTPUT"

      # Test report - we later need the download_url output of the upload step
      - name: Download test report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results
          path: dist/tests/
      - name: Upload test report to release
        id: upload_test_report
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="test-results.tar.gz"
          tar -czf "$archive" -C dist tests
          gh release upload "$TAG" "$archive" --clobber
          echo "browser_download_url=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$archive" >> "$GITHUB_OUTPUT"

      # Test coverage - we later need the download_url output of the upload step
      - name: Download test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: code-coverage-html
          path: dist/codecov/
      - name: Upload test coverage to release
        id: upload_test_coverage
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          archive="code-coverage-html.tar.gz"
          tar -czf "$archive" -C dist codecov
          gh release upload "$TAG" "$archive" --clobber
          echo "browser_download_url=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/$archive" >> "$GITHUB_OUTPUT"

      # README - we later need the download_url output of the upload step
      - name: Upload README to release
        id: upload_readme
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" README.md --clobber
          echo "browser_download_url=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/README.md" >> "$GITHUB_OUTPUT"

      - name: Gather uProtocol Specification documents
        shell: bash
        run: |
          tar cvz --file up-spec.tar.gz ${{ env.UP_SPEC_FILE_PATTERNS }}
      - name: Upload relevant uProtocol Spec files to release
        id: upload_up_spec
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" up-spec.tar.gz --clobber
          echo "browser_download_url=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/up-spec.tar.gz" >> "$GITHUB_OUTPUT"
  
      - name: Gets latest created release info
        id: latest_release_info
        uses: joutvhu/get-release@8c3531bba0d249f5e7c3d7e1954d34db9edf2a90 # v1.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Collect quality artifacts
        uses: eclipse-dash/quevee@b62d7faa1cf68654758754aaed8616b19f227583 # v1.0.0
        id: quevee_manifest
        with:
          release_url: ${{ steps.latest_release_info.outputs.html_url }}
          artifacts_readme: ${{ steps.upload_readme.outputs.browser_download_url }}
          artifacts_requirements: ${{ steps.upload_up_spec.outputs.browser_download_url }}
          artifacts_testing: ${{ steps.upload_test_report.outputs.browser_download_url }},${{ steps.upload_test_coverage.outputs.browser_download_url }},${{ steps.upload_requirements_tracing_report.outputs.browser_download_url }}

      - name: Upload manifest to release
        id: upload_quality_manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          MANIFEST_FILE: ${{ steps.quevee_manifest.outputs.manifest_file }}
        run: |
          gh release upload "$TAG" "${MANIFEST_FILE}" --clobber

  # Publish the crate to crates.io. Set the CRATES_IO_DRY_RUN repository variable
  # to 'true' to verify the package without publishing it. Otherwise, this job
  # publishes using a short-lived OIDC token from crates.io.
  cargo-publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs:
      - tag_release_artifacts
    permissions:
      contents: read
      id-token: write # needed for cargo publish with OIDC token
    env:
      DRY_RUN: ${{ vars.CRATES_IO_DRY_RUN || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - if: env.DRY_RUN == 'true'
        run: cargo publish --all-features --dry-run
      - if: env.DRY_RUN != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --all-features --token ${CARGO_REGISTRY_TOKEN}
